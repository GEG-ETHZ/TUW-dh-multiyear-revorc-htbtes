[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dh-multiyear"
dynamic = ["version"]
description = "Multi-year district-heating optimisation with a reversible ORC/heat pump and a high-temperature borehole storage"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nirav Patel" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24,<2.5",
    "scipy>=1.15,<2",
    "pandas>=2.1,<4",
    "scikit-learn>=1.6,<2",   # loads the revORC / HP surrogate bundles
    "tsam>=3,<4",             # tsam 4 changed its API; time_aggregation.py needs 3.x
    "pyomo>=6.7,<7",
    "highspy>=1.7",           # HiGHS, the default solver (SOLVER=appsi_highs)
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "loguru>=0.7",
]

[project.optional-dependencies]
gurobi = ["gurobipy>=11.0"]       # SOLVER=gurobi; needs a licence
btes-gen = ["pygfunction>=2.2"]   # HT-BTES field simulation in data/btes/gen

[project.urls]
Repository = "https://github.com/nirav0906/dh-multiyear-revorc-htbtes"

[tool.hatch.version]
path = "src/dh_multiyear/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dh_multiyear"]
