name: dh-multiyear
channels:
  - conda-forge
dependencies:
  - python>=3.11,<3.14
  - pyomo>=6.7,<7
  - highspy>=1.7          # HiGHS, the default solver (SOLVER=appsi_highs)
  - pandas>=2.1,<4
  - numpy>=1.24,<2.5
  - scipy>=1.15,<2
  - matplotlib>=3.7
  - openpyxl>=3.1
  - scikit-learn>=1.6,<2  # loads the revORC / HP surrogate bundles
  - joblib>=1.3
  - pip
  - pip:
      - tsam>=3,<4        # representative-day clustering; tsam 4 changed its API
      - loguru>=0.7
      - -e .              # the model code itself (package dh_multiyear in src/)
      # Optional, uncomment if needed:
      # - gurobipy>=11.0  # only for SOLVER=gurobi; needs a licence (free academic licences via grbgetkey)
      # - pygfunction>=2.2  # only for the HT-BTES field simulation in data/btes/gen
