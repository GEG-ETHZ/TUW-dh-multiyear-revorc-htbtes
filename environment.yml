name: dh-multiyear
channels:
  - conda-forge
  - gurobi
dependencies:
  - python>=3.10
  - gurobi>=11.0          # needs a licence; free academic licences via grbgetkey
  - pyomo>=6.7
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.11
  - matplotlib>=3.7
  - openpyxl>=3.1
  - scikit-learn>=1.3     # loads the revORC / HP surrogate bundles
  - joblib>=1.3
  - pip
  - pip:
      - tsam>=2.3         # representative-day clustering
      - loguru>=0.7
      - pygfunction>=2.2  # HT-BTES field simulation (data/btes/gen, validation)
